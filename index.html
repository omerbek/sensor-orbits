<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yörünge koreografisi</title>
<style>
:root {color-scheme: dark; font: 16px system-ui; background: #101419; color: #ebf3f5;}
body {margin: 0 auto; max-width: 68rem; padding: 2rem 1.25rem;}
h1 {font-size: clamp(2.5rem, 9vw, 5rem); margin: 0; letter-spacing: -.05em;}
canvas {display: block; width: 100%; height: auto; border: 1px solid #40535a;}
.controls {display: flex; align-items: center; gap: .75rem; margin-top: .75rem;}
input {flex: 1; min-width: 4rem;}
button {font: inherit; color: inherit; border: 1px solid #40535a; background: #1c262c; border-radius: .25rem; padding: .55rem; text-align: left; cursor: pointer;}
a {color: #9ef4dc;}
fieldset {display:flex; flex-wrap:wrap; gap:.75rem 1rem; margin:0 0 1rem; border:1px solid #40535a;}
fieldset label {display:flex; flex-direction:column; gap:.2rem; font-size:.85rem;}
fieldset input {font:inherit; max-width:15rem; padding:.35rem;}
.controls {flex-wrap:wrap;}
</style>
</head>
<body>
<header><h1>Yörünge koreografisi</h1><p>Üç ölçüm işareti farklı gecikmelerle ortak bir yörünge izler.</p></header>
<main>
<section>
<fieldset id="settings"><legend>Sahne ayarları</legend>
<label for="count">Sensör sayısı<input id="count" value="3" type="number" min="1" max="8" step="1"></label>
<label for="radius">Yatay yarıçap<input id="radius" value="221" type="number" min="60" max="290" step="1"></label>
<label for="lag">Sensör gecikmesi (s)<input id="lag" value="0.55" type="number" min="0" max="1" step="0.05"></label>
</fieldset>
<canvas width="720" height="405" aria-label="Seçili hareket deneyinin önizlemesi"></canvas>
<div class="controls"><button id="play" type="button">Oynat</button><input id="seek" type="range" min="0" max="8" step="0.01" value="0" aria-label="Zaman çizelgesi"><output id="time">0.00 sn</output><button id="save" type="button">PNG indir</button></div>
<p><a href="https://github.com/juliangarnier/anime">İlham kaynağı · GitHub</a></p>
</section>
</main>
<script src="scene.js"></script>
</body>
</html>
